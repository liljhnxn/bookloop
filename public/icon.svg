<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E06D28" />
      <stop offset="100%" stop-color="#C85A17" />
    </linearGradient>
  </defs>
  <!-- Background rounded pill/badge -->
  <rect width="32" height="32" rx="8" fill="#2C1810" />
  
  <!-- Open Book Icon in warm burnt orange and cream -->
  <g transform="translate(4, 5)">
    <!-- Left page -->
    <path d="M12 4C8.5 2.5 4 2.5 2 4V19C4 17.5 8.5 17.5 12 19V4Z" fill="#FAF7F2" stroke="#E06D28" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Right page -->
    <path d="M12 4C15.5 2.5 20 2.5 22 4V19C20 17.5 15.5 17.5 12 19V4Z" fill="#FAF7F2" stroke="#E06D28" stroke-width="1.2" stroke-linejoin="round" />
    <!-- Center spine -->
    <line x1="12" y1="4" x2="12" y2="19" stroke="#C85A17" stroke-width="1.5" stroke-linecap="round" />
    <!-- Page lines left -->
    <line x1="5" y1="8" x2="9" y2="7.5" stroke="#D3BFAB" stroke-width="1" stroke-linecap="round" />
    <line x1="5" y1="11" x2="9" y2="10.5" stroke="#D3BFAB" stroke-width="1" stroke-linecap="round" />
    <line x1="5" y1="14" x2="9" y2="13.5" stroke="#D3BFAB" stroke-width="1" stroke-linecap="round" />
    <!-- Page lines right -->
    <line x1="15" y1="7.5" x2="19" y2="8" stroke="#D3BFAB" stroke-width="1" stroke-linecap="round" />
    <line x1="15" y1="10.5" x2="19" y2="11" stroke="#D3BFAB" stroke-width="1" stroke-linecap="round" />
    <line x1="15" y1="13.5" x2="19" y2="14" stroke="#D3BFAB" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>

